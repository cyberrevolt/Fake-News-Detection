<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | Fake News Detection</title>

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <div class="register-container">

        <h1>Create Account</h1>

        <p class="subtitle">
            Register to access your personal
            Fake News Detection dashboard.
        </p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST"
              action="{{ url_for('register') }}">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                minlength="3"
                maxlength="50"
                autocomplete="username"
                required
            >

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                maxlength="120"
                autocomplete="email"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <label for="confirm_password">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <button type="submit">
                Create Account
            </button>

        </form>

        <div class="footer">
            Already have an account?
            <a href="{{ url_for('login') }}">
                Log in
            </a>
        </div>

        <p class="security-note">
            Your password is stored as a secure hash.
            Registration creates a standard user account,
            not an administrator account.
        </p>

    </div>

</body>

</html>
